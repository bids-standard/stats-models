version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: quarterly
  groups:
    actions-infrastructure:
      patterns:
      - actions/*
- package-ecosystem: uv
  directory: /
  schedule:
    interval: quarterly
  groups:
    build-dependencies:
      patterns:
      - '*'
  ignore:
  # Jupyter Book 2 is a MyST rewrite without Sphinx support; migration needed first
  - dependency-name: jupyter-book
    update-types: [version-update:semver-major]
